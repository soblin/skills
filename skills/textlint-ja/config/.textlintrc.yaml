plugins: {}

filters:
  # allow <!-- textlint-disable --> / <!-- textlint-enable --> escape hatches.
  comments: true

rules:
  ja-no-space-around-parentheses: true
  ja-no-space-between-full-width: true
  ja-space-between-half-and-full-width:
    space: never
  ja-space-around-code:
    before: false
    after: false
  ja-space-around-emphasis:
    before: false
    after: false
  ja-space-around-strong: false
  # enforce Japanese punctuation: "，" and "．" instead of "、" and "。".
  prh:
    rulePaths:
      - .textlint.prh-ja-punctuation.yaml

  preset-ja-technical-writing:
    no-mix-dearu-desumasu:
      preferInHeader: ""
      preferInBody: である
      preferInList: である
      strict: true
    no-double-negative-ja: true
    max-kanji-continuous-len:
      max: 9
      allow: []
    ja-no-mixed-period: false
    sentence-length: false
    no-doubled-joshi: false
    ja-no-weak-phrase: false
    no-exclamation-question-mark: false
    ja-no-redundant-expression: false
