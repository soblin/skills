# Tag the version in the plugin manifest and create a draft release for it,
# unless the tag exists already. Publishing the draft is left to the maintainer.
name: release

on:
  push:
    branches:
      - main
    paths:
      - .claude-plugin/plugin.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Tag and create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          codex_version=$(jq -r .version .codex-plugin/plugin.json)
          if [ "$version" != "$codex_version" ]; then
            echo "::error::.claude-plugin ($version) and .codex-plugin ($codex_version) versions differ"
            exit 1
          fi
          tag="v$version"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag exists; nothing to do"
            exit 0
          fi
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          gh release create "$tag" --verify-tag --draft --generate-notes --title "$tag"
