# keep the textlint skill fixtures verbatim; fixers and linters would rewrite them.
exclude: ^tests/textlint-[^/]+/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        exclude: (^|/)\.devcontainer/devcontainer\.json$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--unsafe]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.yaml, --fix]

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.15.0
    hooks:
      - id: markdown-link-check
        args: [--quiet, --config=.markdown-link-check.json]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: [--no-error-on-unmatched-pattern]

  - repo: local
    hooks:
      - id: textlint
        name: textlint
        language: node
        # textlint --fix exits 0 even when unfixable problems remain, so check again without --fix.
        entry: sh -c 'textlint --fix "$@" && textlint "$@"' --
        types: [markdown]
        additional_dependencies:
          - js-yaml@5.5.0
          - textlint@15.8.0
          - textlint-filter-rule-comments@1.3.0
          - textlint-rule-common-misspellings@1.0.1
          - textlint-rule-ja-no-space-around-parentheses@3.0.4
          - textlint-rule-ja-no-space-between-full-width@3.0.4
          - textlint-rule-ja-space-around-code@3.0.4
          - textlint-rule-ja-space-around-emphasis@3.0.4
          - textlint-rule-ja-space-around-strong@3.0.4
          - textlint-rule-ja-space-between-half-and-full-width@3.0.4
          - textlint-rule-preset-ja-technical-writing@12.0.2
          - textlint-rule-prh@6.1.1
          - textlint-rule-terminology@5.2.16
          - textlint-rule-write-good@2.0.0

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-w, -s, -i=4]
